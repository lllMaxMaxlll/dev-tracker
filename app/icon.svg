<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Teja en el naranja de seguridad (token primary) y tinta casi negra
       (token primary-foreground). Un favicon no puede leer variables CSS, así
       que acá los valores van resueltos a hex; el mismo dibujo con los tokens
       está en components/icons/logo.tsx. -->
  <rect width="32" height="32" rx="4" fill="#ff5f1f"/>
  <g fill="#111111">
    <!-- Techo de diente de sierra -->
    <path d="M6 25V14l5-3.4v5l5-3.4v5l5-3.4V25z"/>
    <!-- Chimenea -->
    <rect x="22.5" y="7" width="3.5" height="18"/>
    <!-- Piso -->
    <rect x="4.5" y="25" width="23" height="2.5"/>
  </g>
</svg>
